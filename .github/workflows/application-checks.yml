name: RAMP application checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ramp_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ramp_test
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/test_phase2b_migration_isolated
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests with isolated keys
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          export JWT_SECRET_KEY="$(openssl rand -hex 32)"
          export PII_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export FERNET_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          DATABASE_URL="$TEST_DATABASE_URL" python -m flask --app backend.app:create_app db upgrade -d backend/migrations
          python -m pytest backend/tests -q --tb=short -o log_cli=false
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from the same archived inputs as the Windows launcher
        run: |
          tar -cf "$RUNNER_TEMP/ramp-build.tar" --exclude "__pycache__" --exclude "*.pyc" --exclude ".env*" --exclude "*.db" -T local_demo/build-inputs.txt
          docker build -f local_demo/Dockerfile -t ramp-system-local-web:latest - < "$RUNNER_TEMP/ramp-build.tar"
          docker compose up --no-build --detach --wait --wait-timeout 180
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Check staff and service user in Chromium
        run: python local_demo/smoke.py
      - name: Verify data after containers are recreated
        run: |
          docker compose down
          docker compose up --detach --wait --wait-timeout 180
          python local_demo/smoke.py --after-restart
      - if: failure()
        run: docker compose logs --tail=120
