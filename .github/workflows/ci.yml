name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
      FLASK_ENV: "testing"
      ALLOW_INSECURE_FALLBACKS: "True"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      JWT_SECRET_KEY: "ci-test-jwt-secret-not-for-production"
      PII_ENCRYPTION_KEY: "zbuAINY3giWh4B9eS7kByftOnBsw3wgOjNODwxSSJ6U="
      FERNET_ENCRYPTION_KEY: "ngMuA47HtIM6_Q4m0_9oYrfMEvQdPxtZv-8QPTDanbc="
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify application import
        run: |
          python -c "
          import backend.app
          from backend.app.models import (
              calculate_plan_end_date,
              calculate_max_review_deadline,
              JobRetentionContract,
              RetentionSupportPlan,
              RetentionSupportPlanDetail,
              RetentionSupportPlanItem,
              RetentionSupportPlanSourceLink,
              SupportPlan,
              LongTermGoal,
              ShortTermGoal,
              MonthlyRetentionReport
          )
          from backend.app.services.job_retention_service import JobRetentionService
          print('App and models import verification successful!')
          "

      - name: Run Job Retention backend tests
        run: |
          pytest backend/tests/test_job_retention_auth.py backend/tests/test_job_retention_slice1.py backend/tests/test_job_retention_slice2.py backend/tests/test_job_retention_plan_integration.py

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (typecheck + vite build)
        run: npm run build
